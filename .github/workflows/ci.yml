name: CI

# Checks only. Nothing here builds or publishes a release; see build.yaml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: ruff
        run: |
          python -m pip install --upgrade pip ruff
          ruff check .

      # shellcheck ships on GitHub's Ubuntu runners.
      - name: shellcheck
        run: shellcheck .github/scripts/*.sh packaging/appimage/AppRun tools/*.sh

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Qt's offscreen platform still loads EGL and fontconfig; ffmpeg lets
      # the m4a/aac decoding test run instead of skipping.
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ffmpeg

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: pytest
        run: python -m pytest -v
