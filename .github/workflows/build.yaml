name: Build and release

# Release flow:
#   1. Releases > Draft a new release > create a new tag (e.g. v1.7.0) > Publish.
#   2. Actions > Build and release > Run workflow > pick that tag under
#      "Use workflow from" > Run workflow.
# The workflow tests the tag, builds Linux/Windows/macOS from it and attaches
# the files and a changelog to that existing release. Rerunning on the same
# tag replaces the files and the generated changelog block.
#
# Deliberately no push/tag triggers: releases only happen when run by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check tag and release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            printf '::error::This run is on the branch "%s", not a tag. Create the release and tag on the Releases page, then pick the tag under "Use workflow from".\n' "$TAG"
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '::error::No release exists for tag %s. Create it on the Releases page first, then run this again.\n' "$TAG"
            exit 1
          fi
          printf 'version=%s\n' "${TAG#v}" >> "$GITHUB_OUTPUT"

  checks:
    name: Tests
    needs: preflight
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: [preflight, checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu runner, so the AppImage carries the
          # oldest glibc requirement and runs on more distros. When GitHub
          # retires it, move to the next oldest (see maintenance.md).
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements.txt

      # Bundled into the AppImage so it runs on desktops that lack them.
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Stamp version
        shell: bash
        run: |
          printf '# Written by the release workflow.\nVERSION = "%s"\n' "$VERSION" > fdf/_version.py

      - name: PyInstaller
        run: pyinstaller --noconfirm FuzzyDuplicateFinder.spec

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/build-appimage.sh "$VERSION"
          APPIMAGE_EXTRACT_AND_RUN=1 "dist/FuzzyDuplicateFinder-$VERSION-x86_64.AppImage" --version
          mkdir -p out
          mv "dist/FuzzyDuplicateFinder-$VERSION-x86_64.AppImage" out/

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app=dist/FuzzyDuplicateFinder.app
          "$app/Contents/MacOS/FuzzyDuplicateFinder" scan assets --exact-only -q --no-watchdog --json smoke.json
          test -s smoke.json
          arch=$(uname -m)
          mkdir -p out
          # ditto keeps the bundle's symlinks and permissions intact.
          ditto -c -k --keepParent "$app" "out/FuzzyDuplicateFinder-$VERSION-macos-$arch.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The EXE is a GUI app with no console, so check it through a file.
          $proc = Start-Process -FilePath dist\FuzzyDuplicateFinder.exe `
            -ArgumentList 'scan', 'assets', '--exact-only', '-q', '--no-watchdog', '--json', 'smoke.json' `
            -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or -not (Test-Path smoke.json)) {
            Write-Error "Smoke test failed with exit code $($proc.ExitCode)"
            exit 1
          }
          # Explorer's Properties > Details tab reads this resource.
          $info = (Get-Item dist\FuzzyDuplicateFinder.exe).VersionInfo
          if ($info.ProductVersion -ne $env:VERSION -or $info.ProductName -ne 'Fuzzy Duplicate Finder') {
            Write-Error "Version resource is '$($info.ProductName)' '$($info.ProductVersion)', expected $env:VERSION"
            exit 1
          }
          New-Item -ItemType Directory -Force out | Out-Null
          Move-Item dist\FuzzyDuplicateFinder.exe "out\FuzzyDuplicateFinder-$env:VERSION-windows-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, for the changelog since the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: build-*
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Upload files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          bash .github/scripts/release-notes.sh generate "$GITHUB_REF_NAME" "$repo_url" > notes.md
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > existing.md
          bash .github/scripts/release-notes.sh merge existing.md notes.md > body.md
          gh release edit "$GITHUB_REF_NAME" --notes-file body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"
