<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Fuzzy Duplicate Finder</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d33"/>
      <stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2196f3"/>
      <stop offset="1" stop-color="#0063a8"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6270"/>
      <stop offset="1" stop-color="#3a4049"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frontClip">
      <rect x="92" y="70" width="112" height="112" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- Back card: the fuzzy duplicate -->
  <g transform="rotate(-9 108 118)" filter="url(#soft)" opacity="0.9">
    <rect x="52" y="54" width="112" height="112" rx="14" fill="url(#ghost)"/>
    <circle cx="136" cy="84" r="10" fill="#8b94a3"/>
    <path d="M60 152 L92 112 L114 136 L128 120 L156 152 Z" fill="#8b94a3"/>
  </g>

  <!-- Front card: the original -->
  <g filter="url(#shadow)">
    <rect x="92" y="70" width="112" height="112" rx="14" fill="url(#card)"/>
  </g>
  <g clip-path="url(#frontClip)">
    <circle cx="176" cy="100" r="11" fill="#ffffff" fill-opacity="0.92"/>
    <path d="M92 182 L130 128 L156 160 L172 140 L204 182 Z" fill="#ffffff" fill-opacity="0.92"/>
  </g>
  <rect x="92" y="70" width="112" height="112" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Similarity badge -->
  <g filter="url(#shadow)">
    <circle cx="186" cy="190" r="34" fill="#4caf50"/>
  </g>
  <circle cx="186" cy="190" r="34" fill="none" stroke="#16181c" stroke-width="5"/>
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <line x1="171" y1="181" x2="201" y2="181"/>
    <line x1="171" y1="199" x2="201" y2="199"/>
  </g>
</svg>
